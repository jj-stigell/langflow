# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: langflow
metadata:
  template: langflow-azure-appservice

# NOTE: azd deploy does not work for direct Docker builds to App Service.
# Use `azd provision` for infrastructure, then run `./deploy-azure.sh` for deployment.

services:
  web:
    project: .
    language: docker
    host: appservice

# Infrastructure configuration
infra:
  provider: bicep
  path: infra
  module: main
